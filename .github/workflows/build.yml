name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      
      - name: Build
        run: |
          cd eid-pd-reader
          go mod tidy
          go build -o eid-pd-reader.exe ./cmd/eid-pd-reader
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eid-pd-reader-windows
          path: eid-pd-reader/eid-pd-reader.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      
      - name: Install PC/SC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev pcscd
      
      - name: Build
        run: |
          cd eid-pd-reader
          go mod tidy
          go build -o eid-pd-reader ./cmd/eid-pd-reader
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eid-pd-reader-linux
          path: eid-pd-reader/eid-pd-reader

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      
      - name: Build
        run: |
          cd eid-pd-reader
          go mod tidy
          go build -o eid-pd-reader ./cmd/eid-pd-reader
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eid-pd-reader-macos
          path: eid-pd-reader/eid-pd-reader

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      
      - name: Install PC/SC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev pcscd

      - name: Run libopenpace-go tests
        run: |
          cd libopenpace-go
          go mod tidy
          go test ./...

      - name: Run eid-pd-reader tests
        run: |
          cd eid-pd-reader
          go mod tidy
          go test ./native/apdu/...
          go test ./native/esteid/...

  package-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Package extension
        run: |
          cd eid-pd-extension/extension
          zip -r ../../eid-pd-extension.zip . -x "*.DS_Store"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eid-pd-extension-package
          path: eid-pd-extension.zip

