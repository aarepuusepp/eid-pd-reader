name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'
  CGO_ENABLED: '1'

defaults:
  run:
    shell: bash

# This checkout contains the reader and third_party/libopenpace-go only.
# Browser extension packaging belongs to the separate eid-pd-extension repository.
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            third_party/libopenpace-go/go.sum
      
      - name: Build
        run: |
          go mod download
          go mod verify
          go build -o build/eid-pd-reader.exe ./cmd/eid-pd-reader
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: eid-pd-reader-windows
          path: build/eid-pd-reader.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            third_party/libopenpace-go/go.sum
      
      - name: Install PC/SC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev pcscd
      
      - name: Build
        run: |
          go mod download
          go mod verify
          go build -o build/eid-pd-reader ./cmd/eid-pd-reader
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: eid-pd-reader-linux
          path: build/eid-pd-reader
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            third_party/libopenpace-go/go.sum
      
      - name: Build
        run: |
          go mod download
          go mod verify
          go build -o build/eid-pd-reader ./cmd/eid-pd-reader
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: eid-pd-reader-macos
          path: build/eid-pd-reader
          if-no-files-found: error

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            third_party/libopenpace-go/go.sum
      
      - name: Install PC/SC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev pcscd

      - name: Run libopenpace-go tests
        working-directory: third_party/libopenpace-go
        run: |
          go mod download
          go mod verify
          go test -race ./...
          go vet ./...

      - name: Run eid-pd-reader tests
        run: |
          go mod download
          go mod verify
          go test -race ./...
          go vet ./...

